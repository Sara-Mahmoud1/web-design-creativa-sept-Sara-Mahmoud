<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Card</title>
    <link rel="stylesheet" href="stylee.css">
</head>
<body>
    <div class="card">
        <div class="cardPrice">
            <h3>PRO PLAN</h3>
            <h1>$19</h1>
            <p>per month</p>
        </div>
        <div class="cardProjects">
            <p>10 Projects</p>
        </div>
        <div class="cardStorage" >
            <p>50 GB Storage</p>
        </div>
        <div class="cardSupport">
            <p>24/7 Support</p>
        </div>
        <div class="button">
            <button class="cardbtn"> <b>Buy Now</b></button>
        </div>
    </div>
</body>
</html>
