<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News cards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="newsStyle.css">
</head>

<body>
    <section class="container">
        <div class="threeCards">
            <div class="card">
                <img src="../../images/people.jpeg" alt="">
                <p class="display">June 12, 2016 </p>
                <p class="display">3 comments</p>
                <h2>Latest news post</h2>
                <p>[Short excerpt of the post- two or three lines that give the reader a reason to click through ]</p>
             

                 <div class="buttons">
                    <button class="btn">java</button>
                    <button>php</button>
                </div>

                <div class="smalldiv">
                    <img src="../../images/circles_Background.jpg" alt="">

                    <div class="author-info">
                        <h6>Author name</h6>
                        <p>4 min read</p>
                    </div>

                    <a href="">
                        <i class="fa-solid fa-circle-arrow-right"></i>
                    </a>
                

                </div>
            </div>
        </div>
    </section>
</body>

</html>
